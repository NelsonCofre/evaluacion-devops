name: Deploy Ventas Service

on:
  push:
    branches: [deploy]
    paths:
      - 'back-Ventas_SpringBoot/**'
      - 'deploy/**'
      - '.github/workflows/ventas-deploy.yml'

jobs:
  ci-cd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Tests Maven
        working-directory: back-Ventas_SpringBoot/Springboot-API-REST
        run: chmod +x mvnw && ./mvnw test -B

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: ./back-Ventas_SpringBoot/Springboot-API-REST
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ventas-service:latest
            ${{ secrets.DOCKER_USERNAME }}/ventas-service:${{ github.sha }}

      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_BACKEND_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy/docker-compose.ec2-backend.yml,deploy/scripts/deploy-backend-ec2.sh"
          target: "/home/${{ secrets.EC2_USER }}/app"

      - uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DB_ENDPOINT: ${{ secrets.DB_ENDPOINT }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        with:
          host: ${{ secrets.EC2_BACKEND_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKER_USERNAME,DOCKER_PASSWORD,DB_ENDPOINT,DB_PORT,DB_NAME,DB_USERNAME,DB_PASSWORD
          script: |
            chmod +x /home/${{ secrets.EC2_USER }}/app/deploy/scripts/deploy-backend-ec2.sh
            /home/${{ secrets.EC2_USER }}/app/deploy/scripts/deploy-backend-ec2.sh
