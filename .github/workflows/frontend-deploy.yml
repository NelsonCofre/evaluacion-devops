name: Deploy Frontend

on:
  push:
    branches: [deploy]
    paths:
      - 'front_despacho/**'
      - 'deploy/**'
      - '.github/workflows/frontend-deploy.yml'

jobs:
  ci-cd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: front_despacho/package-lock.json

      - name: Instalar y build
        working-directory: front_despacho
        run: |
          npm ci
          npm run build

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: ./front_despacho
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/frontend-despacho:latest
            ${{ secrets.DOCKER_USERNAME }}/frontend-despacho:${{ github.sha }}

      - name: Preparar llave SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          printf '%s\n' "$SSH_KEY" > deploy_key.pem
          chmod 600 deploy_key.pem

      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_FRONTEND_HOST }}
          username: ${{ secrets.EC2_USER }}
          key_path: deploy_key.pem
          port: 22
          source: "deploy/docker-compose.ec2-frontend.yml,deploy/scripts/deploy-frontend-ec2.sh"
          target: "/home/${{ secrets.EC2_USER }}/app"

      - uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          BACKEND_VENTAS_HOST: ${{ secrets.BACKEND_VENTAS_HOST }}
          BACKEND_DESPACHO_HOST: ${{ secrets.BACKEND_DESPACHO_HOST }}
        with:
          host: ${{ secrets.EC2_FRONTEND_HOST }}
          username: ${{ secrets.EC2_USER }}
          key_path: deploy_key.pem
          port: 22
          envs: DOCKER_USERNAME,DOCKER_PASSWORD,BACKEND_VENTAS_HOST,BACKEND_DESPACHO_HOST
          script: |
            chmod +x /home/${{ secrets.EC2_USER }}/app/deploy/scripts/deploy-frontend-ec2.sh
            /home/${{ secrets.EC2_USER }}/app/deploy/scripts/deploy-frontend-ec2.sh
