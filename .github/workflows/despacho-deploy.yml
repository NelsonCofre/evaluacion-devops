name: Deploy Despacho Service

on:
  push:
    branches: [deploy]
    paths:
      - 'back-Despachos_SpringBoot/**'
      - 'deploy/**'
      - '.github/workflows/despacho-deploy.yml'

jobs:
  ci-cd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Tests Maven
        working-directory: back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
        run: chmod +x mvnw && ./mvnw test -B

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/despacho-service:latest
            ${{ secrets.DOCKER_USERNAME }}/despacho-service:${{ github.sha }}

      - name: Desplegar en EC2 Backend
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_BACKEND_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DB_ENDPOINT: ${{ secrets.DB_ENDPOINT }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          printf '%s\n' "$SSH_KEY" > deploy_key.pem
          chmod 600 deploy_key.pem
          mkdir -p ~/.ssh
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i deploy_key.pem -o StrictHostKeyChecking=yes "${EC2_USER}@${EC2_HOST}" "mkdir -p /home/${EC2_USER}/app/deploy/scripts"
          scp -i deploy_key.pem -o StrictHostKeyChecking=yes deploy/docker-compose.ec2-backend.yml "${EC2_USER}@${EC2_HOST}:/home/${EC2_USER}/app/deploy/"
          scp -i deploy_key.pem -o StrictHostKeyChecking=yes deploy/scripts/deploy-backend-ec2.sh "${EC2_USER}@${EC2_HOST}:/home/${EC2_USER}/app/deploy/scripts/"
          ssh -i deploy_key.pem -o StrictHostKeyChecking=yes "${EC2_USER}@${EC2_HOST}" \
            "export DOCKER_USERNAME='${DOCKER_USERNAME}' DOCKER_PASSWORD='${DOCKER_PASSWORD}' DB_ENDPOINT='${DB_ENDPOINT}' DB_PORT='${DB_PORT}' DB_NAME='${DB_NAME}' DB_USERNAME='${DB_USERNAME}' DB_PASSWORD='${DB_PASSWORD}' && \
             chmod +x /home/${EC2_USER}/app/deploy/scripts/deploy-backend-ec2.sh && \
             /home/${EC2_USER}/app/deploy/scripts/deploy-backend-ec2.sh"
