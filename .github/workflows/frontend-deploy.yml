name: Deploy Frontend

on:
  push:
    branches: [deploy]
    paths:
      - 'front_despacho/**'
      - 'deploy/**'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:

jobs:
  ci-cd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: front_despacho/package-lock.json

      - name: Instalar y build
        working-directory: front_despacho
        run: |
          npm ci
          npm run build

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: ./front_despacho
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/frontend-despacho:latest
            ${{ secrets.DOCKER_USERNAME }}/frontend-despacho:${{ github.sha }}

      - name: Desplegar en EC2 Frontend
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_FRONTEND_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          BACKEND_VENTAS_HOST: ${{ secrets.BACKEND_VENTAS_HOST }}
          BACKEND_DESPACHO_HOST: ${{ secrets.BACKEND_DESPACHO_HOST }}
        run: |
          printf '%s\n' "$SSH_KEY" > deploy_key.pem
          chmod 600 deploy_key.pem
          mkdir -p ~/.ssh
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i deploy_key.pem -o StrictHostKeyChecking=yes "${EC2_USER}@${EC2_HOST}" "mkdir -p /home/${EC2_USER}/app/deploy/scripts"
          scp -i deploy_key.pem -o StrictHostKeyChecking=yes deploy/docker-compose.ec2-frontend.yml "${EC2_USER}@${EC2_HOST}:/home/${EC2_USER}/app/deploy/"
          scp -i deploy_key.pem -o StrictHostKeyChecking=yes deploy/scripts/deploy-frontend-ec2.sh "${EC2_USER}@${EC2_HOST}:/home/${EC2_USER}/app/deploy/scripts/"
          ssh -i deploy_key.pem -o StrictHostKeyChecking=yes "${EC2_USER}@${EC2_HOST}" \
            "export DOCKER_USERNAME='${DOCKER_USERNAME}' DOCKER_PASSWORD='${DOCKER_PASSWORD}' BACKEND_VENTAS_HOST='${BACKEND_VENTAS_HOST}' BACKEND_DESPACHO_HOST='${BACKEND_DESPACHO_HOST}' && \
             chmod +x /home/${EC2_USER}/app/deploy/scripts/deploy-frontend-ec2.sh && \
             /home/${EC2_USER}/app/deploy/scripts/deploy-frontend-ec2.sh"
